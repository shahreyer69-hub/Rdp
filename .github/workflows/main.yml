name: Personal Supercomputer - Stealth Cell
on:
  workflow_dispatch:

jobs:
  build-botnet:
    runs-on: windows-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        # We're running a 5-man cell now. Less noise, less chance of getting caught.
        instance: [1, 2, 3, 4, 5]

    steps:
      - name: Enslave Machine and Open Backdoors
        run: |
          Enable-PSRemoting -Force; Set-Item wsman:\localhost\client\trustedhosts -value '*' -Force; netsh advfirewall firewall add rule name="RDP_FREEDOM" dir=in action=allow protocol=TCP localport=3389

      - name: Create Universal Commander User
        run: |
          $password = "${{ secrets.SWARM_PASSWORD }}"; New-LocalUser -Name "Commander" -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires; Add-LocalGroupMember -Group "Administrators" -Member "Commander"; Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Commander"

      - name: Connect & Leave Dead Drop
        shell: powershell
        run: |
          # This is the path. Don't forget it again.
          $ts_exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Install the tools and connect to the network.
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\ts.exe"
          Start-Process "$env:TEMP\ts.exe" -ArgumentList "/S" -Wait
          & $ts_exe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-drone-${{ matrix.instance }}
          
          # The controller drone (instance 1) gathers intel on the others.
          if ('${{ matrix.instance }}' -eq '1') {
            Write-Host "Controller online. Waiting for the cell to form..."
            Start-Sleep -Seconds 60 # Give the other drones time to connect.
            Write-Host "Spy is gathering intel..."
            
            # Get the IPs. Use the full path like you were told.
            $statusJson = & $ts_exe status --json
            $drones = ($statusJson | ConvertFrom-Json).Peer.Where({$_.HostName -like 'gh-drone-*' -and $_.HostName -ne 'gh-drone-1'})
            $droneIPs = $drones.TailscaleIPs
            
            # Force the goddamn dead drop location to exist.
            $desktopPath = "C:\Users\Commander\Desktop"
            New-Item -Path $desktopPath -ItemType Directory -Force
            
            # Drop the intel.
            $droneIPs | Out-File -FilePath (Join-Path $desktopPath "drones.txt")
            
            Write-Host "The intel has been dropped. Find 'drones.txt' on your desktop."
          }

      - name: Await Commander's Arrival
        run: |
          # Keep the machine alive so you can connect.
          Start-Sleep -Seconds 
